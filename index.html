<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F1EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B2733" />
    <title>Carbuvolt</title>
    <script>
      // Applique le thème forcé AVANT le premier rendu (anti-flash).
      ;(function () {
        try {
          var t = localStorage.getItem('carnet:theme')
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
